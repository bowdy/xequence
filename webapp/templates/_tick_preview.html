{% if not previews %}
  <div class="text-sm text-zinc-500 bg-zinc-950 border border-zinc-800 rounded-lg p-4">
    Nothing due right now.
  </div>
{% else %}
  <div class="text-xs text-zinc-500 mb-2">
    {{ previews|length }} message(s) would be sent (capped at {{ cap }} per run).
  </div>
  <div class="space-y-2 scroll-y">
    {% for p in previews %}
      <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-3">
        <div class="flex items-center gap-2 text-xs text-zinc-500 mb-1">
          <span class="mono text-zinc-300">@{{ p.handle }}</span>
          <span>· step {{ p.step }}</span>
        </div>
        <pre class="mono text-sm whitespace-pre-wrap text-zinc-200">{{ p.message }}</pre>
      </div>
    {% endfor %}
  </div>
{% endif %}
