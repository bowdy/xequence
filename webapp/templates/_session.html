{% if session_ok %}
  <span class="badge bg-emerald-950 text-emerald-300 border border-emerald-900">
    <span class="pulse-dot"></span>
    X session ready
  </span>
  <span class="text-xs text-zinc-500 ml-2">{{ session_msg }}</span>
{% else %}
  <span class="badge bg-amber-950 text-amber-300 border border-amber-900">no session</span>
  <span class="text-xs text-zinc-500 ml-2">{{ session_msg }}</span>
{% endif %}
