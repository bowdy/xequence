{% if count %}
  <span>Mutuals on disk: <span class="text-zinc-200 mono">{{ count }}</span></span>
  <details class="mt-2">
    <summary class="cursor-pointer text-zinc-500 hover:text-zinc-300">show list</summary>
    <div class="mono text-xs text-zinc-400 scroll-y mt-2 p-3 bg-zinc-950 border border-zinc-800 rounded-lg">
      {% for h in handles %}{{ h }}<br>{% endfor %}
    </div>
  </details>
{% else %}
  <span>No mutuals file yet. Run “Pull mutuals” above.</span>
{% endif %}
