<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4"
     {% if job.status == 'running' %}
     hx-get="/jobs/{{ job.id }}"
     hx-trigger="every 2s"
     hx-swap="outerHTML"
     {% endif %}>
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="mono text-xs text-zinc-500">{{ job.id }}</span>
      <span class="text-sm font-medium">{{ job.name }}</span>
      <span class="badge
        {% if job.status == 'running' %}bg-blue-950 text-blue-300 border border-blue-900
        {% elif job.status == 'succeeded' %}bg-emerald-950 text-emerald-300 border border-emerald-900
        {% elif job.status == 'failed' %}bg-red-950 text-red-300 border border-red-900
        {% else %}bg-zinc-800 text-zinc-300{% endif %}">
        {{ job.status }}
      </span>
    </div>
    {% if job.status == 'running' %}
      <button class="text-xs text-zinc-500 hover:text-red-400"
              hx-post="/jobs/{{ job.id }}/cancel"
              hx-target="closest div"
              hx-swap="outerHTML">cancel</button>
    {% endif %}
  </div>
  {% if job.log %}
    <pre class="mono text-xs text-zinc-400 scroll-y mt-3 p-3 bg-zinc-950 border border-zinc-800 rounded-lg whitespace-pre-wrap">{% for line in job.log %}{{ line }}
{% endfor %}</pre>
  {% endif %}
  {% if job.result %}
    <div class="mt-3 text-xs text-zinc-500">
      result: <span class="mono text-zinc-300">{{ job.result }}</span>
    </div>
  {% endif %}
</div>
